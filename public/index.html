<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>W3BC Balancer</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#10151d;--line:#222b38;--text:#f5f7fa;--muted:#8995a5;--green:#38e88f;--red:#ff5c68;--cyan:#42d9ff;--pink:#ff4fc8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;padding:22px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-weight:900;letter-spacing:.08em}.brand span{color:var(--cyan)}.mode{font-size:11px;padding:7px 10px;border:1px solid #28596a;border-radius:999px;color:var(--cyan);font-weight:800}.hero{padding:20px 0 22px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.value{font-size:40px;font-weight:850;letter-spacing:-.04em;margin-top:4px}.positive{color:var(--green)}.negative{color:var(--red)}.sub{display:flex;gap:18px;margin-top:7px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}.metric,.asset{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.metric strong{display:block;font-size:18px;margin-top:5px}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.section h2{font-size:14px;margin:0;letter-spacing:.05em}.add{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 11px;font-weight:800}.assets{display:grid;gap:10px}.asset-head{display:flex;justify-content:space-between;align-items:start}.symbol{font-weight:900;font-size:17px}.status{width:8px;height:8px;background:var(--green);border-radius:50%;display:inline-block;margin-right:7px;box-shadow:0 0 10px var(--green)}.price{color:var(--muted);font-size:12px;margin-top:3px}.pnl{text-align:right;font-weight:850}.alpha{font-size:11px;color:var(--muted);margin-top:3px}.bar{height:7px;background:#222a35;border-radius:99px;overflow:hidden;margin:14px 0 8px}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:99px}.row{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:1px solid var(--line);background:#151c26;color:var(--text);padding:11px;border-radius:11px;font-weight:800}.btn.pause{color:#ffd86b}.kill{width:100%;margin-top:22px;padding:14px;border-radius:13px;background:transparent;border:1px solid #5a252b;color:#ff7881;font-weight:900}.footer{text-align:center;color:#596575;font-size:10px;margin-top:18px}@media(max-width:370px){.value{font-size:34px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="app">
<div class="top"><div class="brand">W3BC <span>BALANCER</span></div><div class="mode">● SIMULATION</div></div>
<section class="hero"><div class="label">Portfolio Value</div><div class="value" id="portfolio">$2,087.42</div><div class="sub"><span class="positive">+$87.42 P&amp;L</span><span>+4.37%</span></div></section>
<div class="grid"><div class="metric"><div class="label">Realized</div><strong class="positive">+$41.18</strong></div><div class="metric"><div class="label">vs Hold</div><strong class="positive">+$18.64</strong></div><div class="metric"><div class="label">Cash Reserve</div><strong>$972.20</strong></div><div class="metric"><div class="label">Trades</div><strong>14</strong></div></div>
<div class="section"><h2>ACTIVE STRATEGIES</h2><button class="add" id="add">+ ADD ASSET</button></div>
<div class="assets" id="assets"></div>
<button class="kill" id="kill">EMERGENCY PAUSE ALL</button><div class="footer">Simulation only · No wallet transactions enabled</div>
</main>
<script>
const assets=[{symbol:'SOL',price:'$202.18',pnl:62.31,alpha:14.12,allocation:54,trades:8},{symbol:'JCHAINS',price:'$0.000065',pnl:25.11,alpha:4.52,allocation:47,trades:6}];
const root=document.getElementById('assets');
function render(){root.innerHTML=assets.map((a,i)=>`<article class="asset"><div class="asset-head"><div><div class="symbol"><span class="status"></span>${a.symbol} / USDC</div><div class="price">${a.price}</div></div><div class="pnl ${a.pnl>=0?'positive':'negative'}">${a.pnl>=0?'+':''}$${a.pnl.toFixed(2)}<div class="alpha">vs hold ${a.alpha>=0?'+':''}$${a.alpha.toFixed(2)}</div></div></div><div class="bar"><div class="fill" style="width:${a.allocation}%"></div></div><div class="row"><span>${a.allocation}% asset</span><span>${100-a.allocation}% USDC · ${a.trades} trades</span></div><div class="controls"><button class="btn pause" data-pause="${i}">PAUSE</button><button class="btn" data-view="${i}">DETAILS</button></div></article>`).join('')}
render();
root.addEventListener('click',e=>{if(e.target.dataset.pause!==undefined){const b=e.target;b.textContent=b.textContent==='PAUSE'?'RESUME':'PAUSE';b.style.color=b.textContent==='RESUME'?'#38e88f':'#ffd86b'}if(e.target.dataset.view!==undefined)alert(`${assets[e.target.dataset.view].symbol} strategy details will connect to the live engine next.`)});
document.getElementById('kill').addEventListener('click',e=>{document.querySelectorAll('[data-pause]').forEach(b=>{b.textContent='RESUME';b.style.color='#38e88f'});e.target.textContent='ALL STRATEGIES PAUSED'});
document.getElementById('add').addEventListener('click',()=>alert('Next: paste any Solana mint address, set bankroll and strategy limits.'));
</script></body></html>
